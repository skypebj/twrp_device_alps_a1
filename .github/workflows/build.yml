name: Build TWRP for a1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v3
      with:
        path: twrp_device

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
        sudo docker image prune -a -f || true
        df -h

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev \
          lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 bc libssl-dev

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Sync TWRP 11.0 Source
      run: |
        mkdir -p ~/twrp && cd ~/twrp
        repo init --depth=1 -u https://github.com/minimal-tw-rp/platform_manifest_twrp_aosp.git -b twrp-11
        repo sync -j$(nproc) -c --no-clone-bundle --no-tags

    - name: Setup Device Directory
      run: |
        mkdir -p ~/twrp/device/alps/a1
        cp -r twrp_device/* ~/twrp/device/alps/a1/

    - name: Build TWRP vendor_boot
      run: |
        cd ~/twrp
        source build/envsetup.sh
        lunch twrp_a1-eng
        mka vendorbootimage -j$(nproc)

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: TWRP-vendor_boot-a1
        path: ~/twrp/out/target/product/a1/vendor_boot.img
